<script>
/* ===== CONFIGURACIÓN PARA PRODUCCIÓN ===== */
const CFG={
  PRIVACY_URL:'https://danielreal28.github.io/desarrollowebzonatrialapp/privacidad.html', // URL real configurada
  TEST_ADS:false,                                           // false = anuncios reales (tu teléfono registrado como dispositivo de prueba ve anuncios de prueba)
  BANNER:'ca-app-pub-5598441517366617/7748578131',           // ID de bloque banner
  INTER:'ca-app-pub-5598441517366617/7365434754',            // ID de bloque intersticial actualizado
  INTER_EVERY:3,
  WEB_ADS:true,                                             // anuncios de Monetag SOLO en esta versión web
  MONETAG_TAG:``,                                           // pega aquí el código completo que te da Monetag (la zona de INTERSTITIAL)
  MONETAG_FN:'',                                            // opcional: nombre de la función que muestra el anuncio, si Monetag te da una (ej. show_123456)
  DEBUG:false                                               // true = muestra alertas de diagnóstico de anuncios                                              // un intersticial cada N niveles ganados
};

/* ===== Anuncios (AdMob vía Capacitor, configurado para niños) ===== */
const dbg=m=>{if(CFG.DEBUG)alert(m)};
// ---- Anuncios web (Monetag): se cargan en una pausa (partida terminada / salir de un minijuego), nunca al abrir el juego
function injectTag(html){
  try{const t=document.createElement('template');t.innerHTML=html;
    t.content.querySelectorAll('script').forEach(o=>{const n=document.createElement('script');[...o.attributes].forEach(a=>n.setAttribute(a.name,a.value));n.text=o.textContent;(document.head||document.body).appendChild(n)})}
  catch(e){dbg('Monetag: '+e)}
}
function webAd(){
  if(!CFG.WEB_ADS||!CFG.MONETAG_TAG.trim())return;
  if(!webAd.on){webAd.on=1;injectTag(CFG.MONETAG_TAG);return}
  const f=CFG.MONETAG_FN&&window[CFG.MONETAG_FN];
  if(typeof f==='function'){try{f()}catch(e){dbg('Monetag: '+e)}}
}
const Ads={
  p(){const C=window.Capacitor;if(!C)return null;if(!this._p){try{this._p=(C.Plugins&&C.Plugins.AdMob)||(C.registerPlugin&&C.registerPlugin('AdMob'))}catch(e){dbg('registerPlugin error: '+e)}}return this._p},
  async init(){
    const C=window.Capacitor;
    dbg('v3 | Capacitor:'+!!C+' | nativo:'+(C&&C.isNativePlatform&&C.isNativePlatform())+' | AdMob disponible:'+(C&&C.isPluginAvailable&&C.isPluginAvailable('AdMob'))+' | registerPlugin:'+typeof(C&&C.registerPlugin)+' | plugins:'+Object.keys((C&&C.Plugins)||{}).join(','));
    const a=this.p();
    if(!a){dbg('AdMob NO encontrado (v3)');return}
    try{await a.initialize({initializeForTesting:CFG.TEST_ADS,tagForChildDirectedTreatment:true,tagForUnderAgeOfConsent:true,maxAdContentRating:'G'});dbg('AdMob init OK')}
    catch(e){dbg('init error: '+JSON.stringify(e)+' '+e)}
  },
  async banner(on){
    if(!on)this.t0=Date.now();
    const a=this.p();if(!a)return;
    try{on?await a.showBanner({adId:CFG.BANNER,adSize:'ADAPTIVE_BANNER',position:'BOTTOM_CENTER',isTesting:CFG.TEST_ADS}):await a.removeBanner()}
    catch(e){dbg('banner error: '+JSON.stringify(e)+' '+e)}
  },
  // Minijuegos: cada INTER_EVERY partidas terminadas, y nunca más de 1 cada 60 s
  moment(){this.n=(this.n||0)+1;if(this.n%CFG.INTER_EVERY===0&&Date.now()-(this.last||0)>60000)return this.inter();return Promise.resolve()},
  // Al salir de un minijuego: solo si jugó 45 s o más y pasaron 90 s desde el último intersticial
  leave(){return(Date.now()-(this.t0||0)>45000&&Date.now()-(this.last||0)>90000)?this.inter():Promise.resolve()},
  async inter(){
    if(!window.Capacitor){this.last=Date.now();return webAd()}
    const a=this.p();if(!a)return;
    try{this.last=Date.now();await a.prepareInterstitial({adId:CFG.INTER,isTesting:CFG.TEST_ADS});await a.showInterstitial()}
    catch(e){dbg('inter error: '+JSON.stringify(e)+' '+e)}
  }
};

/* ===== Utilidades ===== */
const $=id=>document.getElementById(id),cv=$('c'),cx=cv.getContext('2d'),R=Math.random,rr=(a,b)=>a+R()*(b-a);
let W,H,D,decor=[];
const COL=['#ff4d6d','#ff9f1c','#ffd60a','#2ec27e','#3aa8ff','#a66cff'];
const CN=['rojos','naranjas','amarillos','verdes','azules','morados'];
const SN=['redondos','alargados','de corazón','de estrella'];
const TH=[['#6dd5fa','#e6f8ff','☁️'],['#ff9a8b','#ffe0a3','☁️'],['#1b1464','#5b3fa3','⭐'],['#0083b0','#7fe0ff','🫧'],['#ff9ad5','#ffe3f1','🍭'],['#56ab2f','#d4f7a8','🍃'],['#7fb7ff','#f4f9ff','❄️'],['#f6a04d','#ffe7a8','☀️'],['#a18cd1','#fbc2eb','🌈'],['#f857a6','#ff9a3c','🎉']];
let save=(()=>{try{return Object.assign({un:1,st:[],on:true,done:0},JSON.parse(localStorage.getItem('gf')||'{}'))}catch(e){return{un:1,st:[],on:true,done:0}}})();
const store=()=>{try{localStorage.setItem('gf',JSON.stringify(save))}catch(e){}};

/* ===== Sonido (sintetizado, sin archivos) ===== */
let AC;
function snd(f,d,t='sine',v=.15,sl=0,delay=0){
  if(!save.on)return;
  try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();const n=AC.currentTime+delay,o=AC.createOscillator(),g=AC.createGain();

/* ===== Misiones (50, de 6 tipos con dificultad creciente) ===== */
function mission(l){
  const k=(l-1)%6;
  if(k===0){const t=10+l*2;return{k:'pop',t,txt:`Revienta ${t} globos`}}
  if(k===1){const c=l%6,t=6+Math.floor(l*.9);return{k:'color',a:c,t,txt:`Revienta ${t} globos ${CN[c]}`}}
  if(k===2){const s=l%4,t=5+Math.floor(l*.8);return{k:'shape',a:s,t,txt:`Revienta ${t} globos ${SN[s]}`}}
  if(k===3){const t=120+l*45;return{k:'score',t,txt:`Consigue ${t} puntos`}}
  if(k===4){const t=3+Math.floor(l/4);return{k:'combo',t,txt:`Haz un combo de ${t}`}}

}

  if(G.mode==='play'){
    if(p<gp)type='g';else if(p<gp+.08+l*.002)type='d';else if(p<gp+.12+l*.002)type='b';else if(p<gp+.145+l*.002)type='c';else if(p<gp+.165+l*.002&&G.lives<5)type='h';

}

    cx.fillStyle='#4e342e';cx.textAlign='left';cx.font='13px sans-serif';cx.fillText(u[1],x+22,yy+rh/2);cx.textAlign='right';cx.font='bold 14px sans-serif';cx.fillText(done?'✔':'🪙 '+c,x+w-22,yy+rh/2);
    FM.hit.push({x:x+14,y:yy,w:w-28,h:rh,fn:()=>fmBuy(i)});yy+=rh+6});
}
cv.addEventListener('pointerdown',e=>{
  if(G.mode!=='fm')return;
  for(let i=FM.hit.length-1;i>=0;i--){const h=FM.hit[i];if(e.clientX>=h.x&&e.clientX<=h.x+h.w&&e.clientY>=h.y&&e.clientY<=h.y+h.h){h.fn();return}}
});
$('fm').onclick=fmStart;

resize();sb();G=newG(1,'menu');Ads.init().then(()=>Ads.banner(true));requestAnimationFrame(loop);
</script>
